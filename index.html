<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alivekevin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.6;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a.btn:hover {
      background-color: #2563eb;
    }
    .ads-link {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #64748b;
    }
    .ads-link a {
      color: #64748b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DOK-KEY</h1>
    <p>DOK-KEY 공식 릴리스 및 웹 애플리케이션 페이지입니다.</p>
    <a href="https://alivekevin.github.io/DOK-KEY-release/" class="btn">DOK-KEY 바로가기</a>
  </div>
  <div class="ads-link">
    <a href="./app-ads.txt">app-ads.txt</a>
  </div>
</body>
</html>
